<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazy Gift Mini App</title>
    <meta name="color-scheme" content="dark" />
    <script>{const root=document.documentElement;root.setAttribute("data-theme","dark");root.classList.toggle("dark",true);root.style.colorScheme="dark"}</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" />
    <style>
      :root {
        --color-stage: #14052b;
        --color-glass: rgba(255, 255, 255, 0.08);
        --color-primary: #f5b942;
        --color-foreground: #ffffff;
        --font-sans: "Rubik", sans-serif;
        --font-display: "Montserrat", sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
      body {
        background-color: var(--color-stage);
        color: var(--color-foreground);
        font-family: var(--font-sans);
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      #root { height: 100dvh; display: flex; flex-direction: column; }
      
      .glass {
        background: linear-gradient(160deg, rgba(251, 236, 255, 0.12), rgba(251, 236, 255, 0.04));
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
      }
      
      .gold-text {
        background: linear-gradient(180deg, #fff3a1 0%, #f7b828 50%, #bb731b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      
      /* Navigation styles */
      .nav-bar {
        display: flex;
        justify-content: space-around;
        padding: 12px;
        background: rgba(15, 3, 30, 0.85);
        backdrop-filter: blur(15px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .nav-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: all 0.2s;
      }
      .nav-btn.active {
        color: #f7b828;
      }

      /* Wheel CSS */
      .wheel-container {
        position: relative;
        width: 280px;
        height: 280px;
        margin: 20px auto;
      }
      .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 6px solid #4a1d75;
        box-shadow: 0 0 20px rgba(187, 115, 27, 0.4);
        transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);
        background: conic-gradient(
          #6217ac 0deg 36deg, #e5a422 36deg 72deg,
          #b822e5 72deg 108deg, #229ee5 108deg 144deg,
          #e5225c 144deg 180deg, #22e562 180deg 216deg,
          #6217ac 216deg 252deg, #e5a422 252deg 288deg,
          #b822e5 288deg 324deg, #e5225c 324deg 360deg
        );
      }
      .pointer {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-top: 24px solid #f7b828;
        z-index: 10;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState } = React;

      // Экран Профиля
      function ProfileScreen({ balance, setBalance }) {
        const [promoCode, setPromoCode] = useState('');
        const [promoStatus, setPromoStatus] = useState('');

        const handleActivatePromo = () => {
          if (!promoCode.trim()) return;
          if (promoCode.toUpperCase() === 'CRAZY') {
            setBalance(prev => prev + 500);
            setPromoStatus('Промокод активирован! +500 G');
          } else {
            setPromoStatus('Неверный промокод');
          }
          setPromoCode('');
        };

        return (
          <div style={{ padding: '16px', display: 'flex', flexDirection: 'column', gap: '16px', overflowY: 'auto', flex: 1 }}>
            
            {/* Верхний блок Профиля */}
            <div className="glass" style={{ padding: '16px', position: 'relative' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                
                {/* Левая часть: Аватарка и @username под ней */}
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' }}>
                  <div style={{
                    width: '64px',
                    height: '64px',
                    borderRadius: '50%',
                    background: 'linear-gradient(135deg, #a855f7, #ec4899)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    border: '2px solid #fff',
                    boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
                    fontSize: '28px'
                  }}>
                    👤
                  </div>
                  <span style={{ fontSize: '14px', fontWeight: '600', color: '#e9d5ff' }}>@username</span>
                </div>

                {/* Правая часть: Вертикальные кнопки Пополнить и Вывести */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', minWidth: '120px' }}>
                  <button 
                    onClick={() => setBalance(prev => prev + 1000)}
                    style={{
                      background: 'linear-gradient(90deg, #22c55e, #16a34a)',
                      color: '#fff',
                      padding: '10px 14px',
                      borderRadius: '12px',
                      fontWeight: '700',
                      cursor: 'pointer',
                      boxShadow: '0 4px 10px rgba(34, 197, 94, 0.3)',
                      fontSize: '13px'
                    }}>
                    Пополнить
                  </button>
                  <button 
                    onClick={() => alert('Заявка на вывод создана')}
                    style={{
                      background: 'rgba(239, 68, 68, 0.2)',
                      border: '1px solid rgba(239, 68, 68, 0.4)',
                      color: '#fca5a5',
                      padding: '10px 14px',
                      borderRadius: '12px',
                      fontWeight: '600',
                      cursor: 'pointer',
                      fontSize: '13px'
                    }}>
                    Вывести
                  </button>
                </div>

              </div>

              {/* Баланс */}
              <div style={{ marginTop: '16px', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ color: 'rgba(255,255,255,0.6)', fontSize: '14px' }}>Текущий баланс:</span>
                <span className="gold-text" style={{ fontSize: '20px', fontWeight: '800' }}>{balance} G</span>
              </div>
            </div>

            {/* Панель Промокод */}
            <div className="glass" style={{ padding: '16px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
              <span style={{ fontSize: '13px', color: 'rgba(255,255,255,0.7)', fontWeight: '500' }}>Промокод</span>
              <div style={{ display: 'flex', gap: '8px' }}>
                <input 
                  type="text" 
                  placeholder="Введите промокод..." 
                  value={promoCode}
                  onChange={(e) => setPromoCode(e.target.value)}
                  style={{
                    flex: 1,
                    background: 'rgba(0,0,0,0.3)',
                    border: '1px solid rgba(255,255,255,0.15)',
                    borderRadius: '12px',
                    padding: '10px 14px',
                    color: '#fff',
                    outline: 'none',
                    fontSize: '14px'
                  }}
                />
                <button 
                  onClick={handleActivatePromo}
                  style={{
                    background: 'linear-gradient(90deg, #e5a422, #f7b828)',
                    color: '#000',
                    fontWeight: '700',
                    padding: '10px 16px',
                    borderRadius: '12px',
                    cursor: 'pointer',
                    fontSize: '13px'
                  }}>
                  Активировать
                </button>
              </div>
              {promoStatus && (
                <span style={{ fontSize: '12px', color: promoStatus.includes('Активирован') ? '#4ade80' : '#f87171' }}>
                  {promoStatus}
                </span>
              )}
            </div>

            {/* Панели Депозиты и Выводы */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
              
              {/* Панель Депозиты */}
              <div className="glass" style={{ padding: '14px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                <div style={{
                  width: '36px',
                  height: '36px',
                  borderRadius: '10px',
                  background: 'rgba(34, 197, 94, 0.2)',
                  color: '#4ade80',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: '20px',
                  fontWeight: '900'
                }}>
                  ↑
                </div>
                <div>
                  <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.6)' }}>Депозиты</div>
                  <div style={{ fontSize: '16px', fontWeight: '700', color: '#fff' }}>1,500 G</div>
                </div>
              </div>

              {/* Панель Выводы */}
              <div className="glass" style={{ padding: '14px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                <div style={{
                  width: '36px',
                  height: '36px',
                  borderRadius: '10px',
                  background: 'rgba(239, 68, 68, 0.2)',
                  color: '#f87171',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: '20px',
                  fontWeight: '900'
                }}>
                  ↓
                </div>
                <div>
                  <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.6)' }}>Выводы</div>
                  <div style={{ fontSize: '16px', fontWeight: '700', color: '#fff' }}>0 G</div>
                </div>
              </div>

            </div>

          </div>
        );
      }

      // Главный экран (Колесо)
      function WheelScreen({ balance, setBalance }) {
        const [rotation, setRotation] = useState(0);
        const [isSpinning, setIsSpinning] = useState(false);

        const spinWheel = () => {
          if (isSpinning || balance < 100) return;
          setBalance(prev => prev - 100);
          setIsSpinning(true);

          const randomDeg = Math.floor(Math.random() * 360) + 1440; // 4 полного оборота
          const newRotation = rotation + randomDeg;
          setRotation(newRotation);

          setTimeout(() => {
            setIsSpinning(false);
            setBalance(prev => prev + 250); // Выигрыш
          }, 4000);
        };

        return (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
            <h1 className="gold-text" style={{ fontFamily: 'var(--font-display)', fontSize: '26px', fontWeight: '900', marginBottom: '10px' }}>
              LORD SPIN
            </h1>

            <div className="wheel-container">
              <div className="pointer"></div>
              <div className="wheel" style={{ transform: `rotate(${rotation}deg)` }}></div>
            </div>

            <button 
              onClick={spinWheel}
              disabled={isSpinning || balance < 100}
              style={{
                marginTop: '20px',
                width: '80%',
                maxWidth: '280px',
                padding: '14px',
                borderRadius: '16px',
                background: isSpinning ? '#555' : 'linear-gradient(180deg, #fff3a1, #f7b828)',
                border: 'none',
                color: '#000',
                fontWeight: '800',
                fontSize: '16px',
                cursor: isSpinning ? 'not-allowed' : 'pointer',
                boxShadow: '0 6px 20px rgba(247, 184, 40, 0.4)'
              }}>
              {isSpinning ? 'ВРАЩЕНИЕ...' : 'КРУТИТЬ (100 G)'}
            </button>
          </div>
        );
      }

      // Инвентарь
      function InventoryScreen() {
        return (
          <div style={{ padding: '16px', flex: 1, overflowY: 'auto' }}>
            <h2 style={{ fontSize: '18px', fontWeight: '700', marginBottom: '12px' }}>Мои Призы</h2>
            <div className="glass" style={{ padding: '20px', textAlign: 'center', color: 'rgba(255,255,255,0.5)' }}>
              Ваш инвентарь пока пуст
            </div>
          </div>
        );
      }

      // Корневое приложение
      function App() {
        const [activeTab, setActiveTab] = useState('wheel');
        const [balance, setBalance] = useState(1000);

        return (
          <div id="root">
            {activeTab === 'wheel' && <WheelScreen balance={balance} setBalance={setBalance} />}
            {activeTab === 'inventory' && <InventoryScreen />}
            {activeTab === 'profile' && <ProfileScreen balance={balance} setBalance={setBalance} />}

            {/* Навигационная панель */}
            <div className="nav-bar">
              <button className={`nav-btn ${activeTab === 'wheel' ? 'active' : ''}`} onClick={() => setActiveTab('wheel')}>
                <span style={{ fontSize: '20px' }}>🎡</span>
                <span>Колесо</span>
              </button>
              <button className={`nav-btn ${activeTab === 'inventory' ? 'active' : ''}`} onClick={() => setActiveTab('inventory')}>
                <span style={{ fontSize: '20px' }}>🎒</span>
                <span>Инвентарь</span>
              </button>
              <button className={`nav-btn ${activeTab === 'profile' ? 'active' : ''}`} onClick={() => setActiveTab('profile')}>
                <span style={{ fontSize: '20px' }}>👤</span>
                <span>Профиль</span>
              </button>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
