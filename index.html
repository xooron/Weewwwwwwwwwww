<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LORD SPIN</title>
  <!-- Tailwind CSS для стилей -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons для иконок -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Градиентный текст для логотипа */
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      background-image: linear-gradient(to right, #a78bfa, #ec4899);
    }

    /* Стили для секторов рулетки (аналог clipPath из React) */
    .wheel-sector {
      position: absolute;
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 50% 100%);
      transform-origin: bottom right;
    }

    /* Анимация вращения */
    .wheel-spinning {
      transition: transform 5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Стили для диалоговых окон (модалок) */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      max-width: 90%;
      width: 400px;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-950 to-black text-white flex flex-col font-sans">

  <!-- Фоновые эффекты -->
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top_right,rgba(70,70,70,0.15),transparent_70%)] pointer-events-none"></div>
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_bottom_left,rgba(120,50,200,0.1),transparent_70%)] pointer-events-none"></div>

  <!-- Верхняя панель -->
  <header class="sticky top-0 z-10 backdrop-blur-md bg-black/40 border-b border-white/10 px-4 py-3">
    <div class="flex justify-between items-center max-w-md mx-auto">
      <div class="font-bold text-xl text-gradient">LORD SPIN</div>
      <div class="flex items-center gap-3">
        <div id="balance-card" class="px-3 py-1.5 bg-white/10 backdrop-blur-md border border-white/20 rounded-full flex items-center gap-2">
          <i data-lucide="coins" class="w-4 h-4 text-yellow-400"></i>
          <span id="balance-text" class="font-medium">0 L</span>
        </div>
        <button id="profile-btn" class="w-9 h-9 rounded-full overflow-hidden border-2 border-purple-500 hover:border-purple-400 transition-all">
          <img id="avatar-img" src="https://picsum.photos/id/1005/200/200" alt="Profile" class="w-full h-full object-cover">
        </button>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full">
    <!-- Рулетка -->
    <div class="relative w-72 h-72 mb-8">
      <div class="absolute inset-0 rounded-full bg-gradient-to-br from-purple-900/30 to-pink-900/30 backdrop-blur-sm border border-white/10 shadow-lg"></div>
      
      <div id="wheel" class="absolute inset-4 rounded-full overflow-hidden">
        <!-- Секторы будут добавлены через JS -->
      </div>

      <div class="absolute inset-1/4 rounded-full bg-black flex items-center justify-center border-2 border-purple-500 shadow-lg">
        <div class="w-5 h-5 rounded-full bg-gradient-to-br from-purple-400 to-pink-500"></div>
      </div>

      <!-- Указатель -->
      <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-6 h-10 flex flex-col items-center">
        <div class="w-6 h-6 bg-red-500 rotate-45 shadow-lg"></div>
        <div class="w-4 h-4 bg-red-600 rotate-45 mt-1"></div>
      </div>
    </div>

    <!-- Кнопка прокрутки -->
    <div class="w-full mb-6">
      <button id="spin-btn" class="w-full py-6 text-lg font-bold rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 transform hover:scale-[1.02] transition-all shadow-lg disabled:bg-gray-700 disabled:cursor-not-allowed disabled:opacity-70">
        <div class="flex items-center justify-center gap-2" id="spin-btn-content">
          <i data-lucide="gift" class="w-5 h-5"></i>
          <span>Крутить колесо</span>
        </div>
      </button>
    </div>

    <!-- Инвентарь -->
    <div id="inventory-card" class="w-full bg-white/5 backdrop-blur-md border border-white/10 p-4 rounded-xl cursor-pointer hover:bg-white/10 transition-all flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="package" class="w-5 h-5 text-purple-400"></i>
        <span class="font-medium">Инвентарь</span>
      </div>
      <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
    </div>
  </main>

  <!-- Нижняя навигация -->
  <footer class="sticky bottom-0 backdrop-blur-md bg-black/40 border-t border-white/10 px-4 py-3">
    <div class="flex justify-around max-w-md mx-auto">
      <button class="flex flex-col items-center text-xs text-gray-400 hover:text-white">
        <i data-lucide="gift" class="w-5 h-5"></i>
        <span>Spin</span>
      </button>
      <button id="footer-profile-btn" class="flex flex-col items-center text-xs text-gray-400 hover:text-white">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span>Профиль</span>
      </button>
      <button class="flex flex-col items-center text-xs text-gray-400 hover:text-white">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span>Настройки</span>
      </button>
    </div>
  </footer>

  <!-- Модальное окно профиля -->
  <div id="profile-modal" class="modal-bg">
    <div class="modal-content p-6 text-white">
      <h2 class="text-center text-xl font-bold mb-6">Профиль</h2>
      <div class="flex flex-col items-center">
        <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-purple-500 mb-4">
          <img id="modal-avatar" src="https://picsum.photos/id/1005/200/200" alt="Profile" class="w-full h-full object-cover">
        </div>
        <h3 id="modal-username" class="text-xl font-bold mb-1">@lord_user</h3>
        <div class="flex gap-6 mt-6">
          <div class="text-center">
            <div id="modal-balance" class="text-2xl font-bold text-purple-400">0</div>
            <div class="text-sm text-gray-400">L</div>
          </div>
          <div class="text-center">
            <div class="text-2xl font-bold text-pink-400">0</div>
            <div class="text-sm text-gray-400">Призы</div>
          </div>
        </div>
        <button id="logout-btn" class="mt-6 w-full bg-red-600 hover:bg-red-700 py-2 rounded-xl flex items-center justify-center gap-2">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Выйти</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно инвентаря -->
  <div id="inventory-modal" class="modal-bg">
    <div class="modal-content p-6 text-white">
      <h2 class="text-center text-xl font-bold mb-6">Инвентарь</h2>
      <div class="py-8 text-center">
        <div class="mb-4 opacity-50">
          <i data-lucide="gift" class="w-12 h-12 text-purple-400 mx-auto"></i>
        </div>
        <p class="text-gray-400">Ваш инвентарь пуст</p>
        <p class="text-sm text-gray-500 mt-1">Выигрывайте призы, вращая колесо</p>
      </div>
    </div>
  </div>

  <script>
    // Инициализация иконок
    lucide.createIcons();

    // Данные призов (аналог интерфейса Prize)
    const prizes = [
      { id: 1, name: "10 L", color: "#FFD700", amount: 10 },
      { id: 2, name: "50 L", color: "#32CD32", amount: 50 },
      { id: 3, name: "100 L", color: "#1E90FF", amount: 100 },
      { id: 4, name: "25 L", color: "#FF6347", amount: 25 },
      { id: 5, name: "75 L", color: "#9370DB", amount: 75 },
      { id: 6, name: "5 L", color: "#FF69B4", amount: 5 },
      { id: 7, name: "200 L", color: "#00CED1", amount: 200 },
      { id: 8, name: "15 L", color: "#FF8C00", amount: 15 },
      { id: 9, name: "10 L", color: "#FFD700", amount: 10 },
      { id: 10, name: "50 L", color: "#32CD32", amount: 50 }
    ];

    // Состояние приложения
    const state = {
      balance: 0,
      rotation: 0,
      isSpinning: false,
      timeUntilNextSpin: 0,
      showProfile: false,
      showInventory: false,
      user: { username: "lord_user", avatar: "https://picsum.photos/id/1005/200/200" }
    };

    // Элементы DOM
    const wheel = document.getElementById('wheel');
    const balanceText = document.getElementById('balance-text');
    const spinBtn = document.getElementById('spin-btn');
    const spinBtnContent = document.getElementById('spin-btn-content');
    const profileModal = document.getElementById('profile-modal');
    const inventoryModal = document.getElementById('inventory-modal');
    const timerSpan = document.createElement('span');

    // Рендеринг секторов рулетки
    function renderWheel() {
      wheel.innerHTML = '';
      const degreesPerPrize = 360 / prizes.length;
      
      prizes.forEach((prize, i) => {
        const sector = document.createElement('div');
        sector.className = 'wheel-sector';
        sector.style.transform = `rotate(${i * degreesPerPrize}deg)`;
        sector.style.backgroundColor = prize.color;
        sector.style.opacity = '0.8';

        const label = document.createElement('div');
        label.className = 'absolute text-white font-bold';
        label.textContent = prize.name;
        label.style.left = '70%';
        label.style.top = '50%';
        label.style.transform = `translate(-50%, -50%) rotate(${i * degreesPerPrize + degreesPerPrize / 2}deg)`;
        
        sector.appendChild(label);
        wheel.appendChild(sector);
      });
    }

    // Форматирование времени (HH:MM:SS)
    function formatTime(ms) {
      const hours = Math.floor(ms / (60 * 60 * 1000));
      const minutes = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
      const seconds = Math.floor((ms % (60 * 1000)) / 1000);
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // Обновление UI
    function updateUI() {
      balanceText.textContent = state.balance;
      document.getElementById('modal-balance').textContent = state.balance;
      document.getElementById('modal-username').textContent = `@${state.user.username}`;
      document.getElementById('avatar-img').src = state.user.avatar;
      document.getElementById('modal-avatar').src = state.user.avatar;

      if (state.isSpinning) {
        spinBtnContent.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div><span>Крутим...</span>';
      } else if (state.timeUntilNextSpin > 0) {
        spinBtnContent.innerHTML = `<i data-lucide="rotate-ccw" class="w-5 h-5"></i><span>Следующий спин: ${formatTime(state.timeUntilNextSpin)}</span>`;
      } else {
        spinBtnContent.innerHTML = '<i data-lucide="gift" class="w-5 h-5"></i><span>Крутить колесо</span>';
      }
    }

    // Функция вращения
    function spinWheel() {
      if (state.isSpinning || state.timeUntilNextSpin > 0) return;

      state.isSpinning = true;
      updateUI();

      const prizeIndex = Math.floor(Math.random() * prizes.length);
      const extraSpins = 5;
      const degreesPerPrize = 360 / prizes.length;
      const targetRotation = state.rotation + (extraSpins * 360) + (prizeIndex * degreesPerPrize);

      wheel.style.transform = `rotate(${targetRotation}deg)`;
      wheel.classList.add('wheel-spinning');

      setTimeout(() => {
        wheel.classList.remove('wheel-spinning');
        
        const wonPrize = prizes[prizeIndex];
        state.balance += wonPrize.amount;
        state.rotation = targetRotation;

        localStorage.setItem('balance', state.balance);
        localStorage.setItem('lastSpinTime', Date.now().toString());

        const sixHours = 6 * 60 * 60 * 1000;
        state.timeUntilNextSpin = sixHours;

        state.isSpinning = false;
        updateUI();

        alert(`Поздравляем! Вы выиграли ${wonPrize.amount} L!`);
      }, 5000);
    }

    // Таймер обратного отсчета
    function startTimer() {
      if (state.timeUntilNextSpin <= 0) return;
      const timer = setInterval(() => {
        state.timeUntilNextSpin -= 1000;
        if (state.timeUntilNextSpin <= 0) {
          state.timeUntilNextSpin = 0;
          clearInterval(timer);
        }
        updateUI();
      }, 1000);
    }

    // Загрузка данных из localStorage
    function loadState() {
      const savedBalance = localStorage.getItem('balance');
      if (savedBalance) state.balance = parseInt(savedBalance);

      const lastSpinTime = localStorage.getItem('lastSpinTime');
      if (lastSpinTime) {
        const now = Date.now();
        const elapsed = now - parseInt(lastSpinTime);
        const sixHours = 6 * 60 * 60 * 1000;
        if (elapsed < sixHours) {
          state.timeUntilNextSpin = sixHours - elapsed;
        }
      }
    }

    // Слушатели событий
    spinBtn.addEventListener('click', spinWheel);
    document.getElementById('inventory-card').addEventListener('click', () => {
      inventoryModal.style.display = 'flex';
    });
    document.getElementById('profile-btn').addEventListener('click', () => {
      profileModal.style.display = 'flex';
    });
    document.getElementById('footer-profile-btn').addEventListener('click', () => {
      profileModal.style.display = 'flex';
    });
    profileModal.addEventListener('click', (e) => {
      if (e.target === profileModal) profileModal.style.display = 'none';
    });
    inventoryModal.addEventListener('click', (e) => {
      if (e.target === inventoryModal) inventoryModal.style.display = 'none';
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      state.balance = 0;
      state.timeUntilNextSpin = 0;
      state.isSpinning = false;
      updateUI();
      profileModal.style.display = 'none';
    });

    // Инициализация
    loadState();
    renderWheel();
    updateUI();
    startTimer();
  </script>
</body>
</html>
