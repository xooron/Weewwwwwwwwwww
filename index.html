<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030813">
<title>Strategy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: logo top-left, profile top-right, animated category cards centred below; deep navy field with drifting light behind glass */
  :root {
    --bg: #030813;
    --bg-deep: #02050d;
    --blue: #2f6bff;
    --blue-soft: #5b8dff;
    --ice: #b4cdff;
    --text: #eaf0fe;
    --muted: #8a9fc4;
    --glass: rgba(110, 150, 255, 0.07);
    --glass-strong: rgba(120, 165, 255, 0.14);
    --glass-edge: rgba(160, 195, 255, 0.18);
    --glass-hi: rgba(215, 230, 255, 0.24);
    --acc: 106, 160, 255;
    --g1: #6aa0ff;
    --g2: #2a55e0;
    --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
    --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    /* safe areas: Telegram's own insets (fullscreen mode) or the device's, whichever is larger */
    --top: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
    --bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; background: var(--bg); }

  body {
    min-height: 100vh;
    min-height: var(--tg-viewport-stable-height, 100dvh);
    display: flex;
    flex-direction: column;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-top: calc(var(--top) + 12px);
    padding-bottom: calc(var(--bottom) + 20px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
  }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 2px; }

  /* ---------- background ---------- */
  .field {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
  .orb.a { width: 78vmax; height: 78vmax; left: -28vmax; top: -34vmax; background: rgba(47, 107, 255, 0.5); animation: drift1 22s ease-in-out infinite alternate; }
  .orb.b { width: 60vmax; height: 60vmax; right: -26vmax; top: 6vmax; background: rgba(28, 64, 190, 0.45); animation: drift2 26s ease-in-out infinite alternate; }
  .orb.c { width: 70vmax; height: 70vmax; left: 10vmax; bottom: -42vmax; background: rgba(24, 58, 170, 0.5); animation: drift3 30s ease-in-out infinite alternate; }
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(200, 220, 255, 0.8), transparent),
      radial-gradient(1px 1px at 78% 12%, rgba(200, 220, 255, 0.6), transparent),
      radial-gradient(1.4px 1.4px at 44% 36%, rgba(200, 220, 255, 0.55), transparent),
      radial-gradient(1px 1px at 90% 48%, rgba(200, 220, 255, 0.65), transparent),
      radial-gradient(1px 1px at 22% 64%, rgba(200, 220, 255, 0.55), transparent),
      radial-gradient(1.4px 1.4px at 62% 82%, rgba(200, 220, 255, 0.6), transparent),
      radial-gradient(1px 1px at 8% 90%, rgba(200, 220, 255, 0.55), transparent);
    animation: tw 5s ease-in-out infinite alternate;
  }
  .shoot {
    position: absolute;
    top: 14%; left: 62%;
    width: 120px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(210, 228, 255, 0), rgba(210, 228, 255, 0.95));
    opacity: 0;
    transform: rotate(-35deg);
    animation: shoot 9s ease-in infinite;
    animation-delay: 3s;
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(1, 3, 9, 0.7) 100%); }
  @keyframes drift1 { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.08); } }
  @keyframes drift2 { to { transform: translate3d(-8vmax, 10vmax, 0) scale(0.94); } }
  @keyframes drift3 { to { transform: translate3d(6vmax, -8vmax, 0) scale(1.1); } }
  @keyframes tw { from { opacity: 0.45; } to { opacity: 1; } }
  @keyframes shoot {
    0%, 82% { opacity: 0; transform: translate3d(0, 0, 0) rotate(-35deg); }
    84% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(-260px, 180px, 0) rotate(-35deg); }
  }

  /* ---------- top row ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; animation: down .6s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes down { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }

  .brand { display: inline-flex; align-items: center; gap: 11px; min-width: 0; }
  .brand svg { width: 42px; height: 42px; flex: none; animation: logoGlow 3.4s ease-in-out infinite alternate; }
  @keyframes logoGlow {
    from { filter: drop-shadow(0 6px 12px rgba(47, 107, 255, 0.45)); }
    to   { filter: drop-shadow(0 8px 24px rgba(91, 141, 255, 0.95)); }
  }
  .brand span {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 23px;
    letter-spacing: -0.025em;
    background: linear-gradient(180deg, #ffffff 30%, #b4cdff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .profile {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    max-width: 52vw;
    padding: 4px 14px 4px 4px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(120, 165, 255, 0.16), rgba(80, 120, 230, 0.06));
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 12px 28px -12px rgba(0, 0, 0, 0.75);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    cursor: pointer;
    transition: transform .15s;
  }
  .profile:active { transform: scale(0.95); }

  /* gradient hairline border for glass elements */
  .profile::before, .card::before, .row::before, .empty::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(155deg, rgba(200, 222, 255, 0.55), rgba(120, 160, 255, 0.1) 38%, rgba(120, 160, 255, 0.03) 62%, rgba(170, 200, 255, 0.34));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }

  .avatar {
    width: 38px; height: 38px;
    flex: none;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 50%;
    background: linear-gradient(145deg, #6c9bff, #1c3fb0);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 4px 14px rgba(47, 107, 255, 0.5);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }

  /* ---------- centre: categories ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 0 3vh;
  }

  .head { text-align: center; animation: up .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: .05s; }
  .lead {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 8.4vw, 40px);
    line-height: 1.08;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); font-size: 15px; }

  .grid {
    width: 100%;
    max-width: 520px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .card {
    position: relative;
    min-width: 0;
    min-height: 156px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 16px;
    border: 0;
    border-radius: 28px;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(var(--acc), 0.17), rgba(60, 100, 220, 0.04) 72%);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 22px 44px -20px rgba(0, 0, 0, 0.8);
    -webkit-backdrop-filter: blur(24px) saturate(170%);
    backdrop-filter: blur(24px) saturate(170%);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
    animation:
      up .7s cubic-bezier(.2, .8, .2, 1) calc(var(--i) * 80ms + 120ms) backwards,
      bob 6.5s ease-in-out calc(var(--i) * -1.3s) infinite;
  }
  .card::after {
    content: "";
    position: absolute;
    width: 190px; height: 190px;
    right: -70px; top: -80px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--acc), 0.4), transparent);
    pointer-events: none;
    animation: breathe 4s ease-in-out infinite alternate;
  }
  .card:active { transform: scale(0.96); }

  .art-wrap {
    position: absolute;
    right: 6px; top: 8px;
    width: 98px; height: 98px;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 10px 18px rgba(var(--acc), 0.4));
  }
  .art { width: 100%; height: 100%; display: block; overflow: visible; }

  .card.wide {
    grid-column: 1 / -1;
    min-height: 0;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 14px 18px 14px 12px;
    background: linear-gradient(120deg, rgba(var(--acc), 0.24), rgba(60, 100, 220, 0.05) 78%);
  }
  .card.wide::after { right: -50px; top: -100px; width: 240px; height: 240px; }
  .card.wide .art-wrap { position: relative; right: auto; top: auto; width: 88px; height: 88px; flex: none; }

  .txt { min-width: 0; position: relative; z-index: 2; padding-right: 34px; }
  .card.wide .txt { padding-right: 0; flex: 1; }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.2; letter-spacing: -0.015em; }
  .card .cnt { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .card .go {
    position: absolute;
    right: 14px; bottom: 14px;
    z-index: 2;
    width: 30px; height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(var(--acc), 0.22);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .card.wide .go { position: static; flex: none; }
  .card .go svg { width: 14px; height: 14px; }

  @keyframes up { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes breathe { from { opacity: 0.65; transform: scale(0.94); } to { opacity: 1; transform: scale(1.06); } }

  /* ---------- illustrations ---------- */
  .art * { transform-box: fill-box; transform-origin: center; }
  @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.55); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes wave { 0% { opacity: 0; transform: translateX(-6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateX(9px); } }
  @keyframes wig { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  .a-fa { animation: floatA 4s ease-in-out infinite; }
  .a-fb { animation: floatB 4s ease-in-out infinite; }
  .a-d1, .a-d2, .a-d3 { animation: dot 1.3s ease-in-out infinite; }
  .a-d2 { animation-delay: .18s; }
  .a-d3 { animation-delay: .36s; }
  .a-ring { animation: spin 22s linear infinite; }
  .a-star { animation: pulse 2.8s ease-in-out infinite; }
  .a-sp { animation: twinkle 2.4s ease-in-out infinite; }
  .a-sp.s2 { animation-delay: .6s; }
  .a-sp.s3 { animation-delay: 1.2s; }
  .a-sp.s4 { animation-delay: 1.8s; }
  .a-wv { animation: wave 2.4s ease-out infinite; }
  .a-wv.w2 { animation-delay: .5s; }
  .a-wv.w3 { animation-delay: 1s; }
  .a-wig { animation: wig 3s ease-in-out infinite; transform-origin: 30% 60%; }
  .art .a-o1 { transform-box: view-box; transform-origin: 60px 60px; animation: spin 14s linear infinite; }
  .art .a-o2 { transform-box: view-box; transform-origin: 60px 60px; animation: spinRev 9s linear infinite; }
  .a-check { stroke-dasharray: 50; animation: draw 3.2s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 50; } 35%, 82% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 50; } }
  @keyframes wobble { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  .a-halo { animation: pulse 2.6s ease-in-out infinite; }
  .a-chip { animation: spin 8s linear infinite; }
  .a-w1 { animation: wobble 3.2s ease-in-out infinite; }
  .a-w2 { animation: wobble 3.2s ease-in-out infinite reverse; }

  /* ---------- sheets ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(1, 4, 12, 0.62);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .sheet.open { display: flex; animation: fade .2s ease-out; }
  .panel {
    position: relative;
    width: 100%;
    max-width: 520px;
    max-height: 86vh;
    max-height: min(86vh, calc(var(--tg-viewport-stable-height, 100dvh) - var(--top) - 20px));
    display: flex;
    flex-direction: column;
    padding: 12px 18px calc(var(--bottom) + 18px);
    border-radius: 32px 32px 0 0;
    background: linear-gradient(180deg, rgba(22, 42, 92, 0.95), rgba(5, 12, 32, 0.98));
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 -30px 90px -20px rgba(var(--acc), 0.4);
    -webkit-backdrop-filter: blur(36px) saturate(170%);
    backdrop-filter: blur(36px) saturate(170%);
  }
  .panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(200, 222, 255, 0.5), rgba(120, 160, 255, 0.08) 45%, transparent);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .sheet.open .panel { animation: rise .36s cubic-bezier(.2, .8, .2, 1); }
  .grab { width: 40px; height: 4px; margin: 0 auto 8px; border-radius: 4px; background: var(--glass-edge); flex: none; }

  .close {
    position: absolute;
    right: 14px; top: 16px;
    z-index: 3;
    width: 36px; height: 36px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--glass-strong);
    color: var(--muted);
    cursor: pointer;
  }
  .close:active { transform: scale(0.9); }
  .close svg { width: 16px; height: 16px; }

  .banner { position: relative; height: 140px; flex: none; display: grid; place-items: center; }
  .banner::before {
    content: "";
    position: absolute;
    width: 260px; height: 150px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(var(--acc), 0.5), transparent);
    animation: breathe 3.6s ease-in-out infinite alternate;
  }
  .artbig { position: relative; width: 130px; height: 130px; filter: drop-shadow(0 14px 26px rgba(var(--acc), 0.5)); }
  .sheet.open .artbig { animation: pop .6s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: .1s; }
  @keyframes pop { from { opacity: 0; transform: scale(0.6) rotate(-6deg); } to { opacity: 1; transform: none; } }

  .ptitle { text-align: center; margin-bottom: 14px; flex: none; }
  .ptitle h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -0.025em; line-height: 1.15; }
  .ptitle p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .phead { display: flex; align-items: center; gap: 14px; margin: 6px 44px 16px 0; flex: none; }
  .phead h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.02em; line-height: 1.15; }
  .phead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .phead .avatar { width: 56px; height: 56px; font-size: 22px; }

  .list { display: grid; gap: 10px; overflow-y: auto; padding: 2px 0 4px; min-height: 0; -webkit-overflow-scrolling: touch; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 12px 12px 14px;
    border: 0;
    border-radius: 22px;
    text-align: left;
    background: linear-gradient(160deg, rgba(var(--acc), 0.13), rgba(60, 100, 220, 0.04));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }
  .sheet.open .row { animation: slideIn .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 50ms + 160ms); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }

  .tile {
    width: 44px; height: 44px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 15px;
    color: #fff;
    background: linear-gradient(145deg, var(--g1), var(--g2));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 8px 18px -6px rgba(var(--acc), 0.7);
  }
  .tile svg { width: 21px; height: 21px; }
  .row .tx { min-width: 0; flex: 1; }
  .row b { display: block; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .go-btn {
    position: relative;
    overflow: hidden;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 11px 16px 11px 18px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 10px 22px -8px rgba(var(--acc), 0.9);
    transition: transform .15s, box-shadow .2s;
  }
  .go-btn:active { transform: scale(0.92); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 4px 10px -4px rgba(var(--acc), 0.9); }
  .go-btn svg { width: 14px; height: 14px; }
  .go-btn::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 220ms);
  }
  @keyframes sweep { 0%, 55% { left: -60%; } 100% { left: 130%; } }

  .empty {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 6px;
    padding: 26px 20px;
    border-radius: 24px;
    text-align: center;
    background: rgba(var(--acc), 0.06);
    border: 1px dashed rgba(var(--acc), 0.4);
    animation: up .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  .empty::before { display: none; }
  .empty .ei { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 16px; color: #fff; background: linear-gradient(145deg, var(--g1), var(--g2)); animation: floatA 3.4s ease-in-out infinite; box-shadow: 0 10px 22px -8px rgba(var(--acc), 0.8); }
  .empty .ei svg { width: 22px; height: 22px; }
  .empty b { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .empty span { color: var(--muted); font-size: 14px; }

  .row.plain { justify-content: space-between; padding: 15px 16px; }
  .row.plain span { font-size: 15px; }
  .row.plain svg { width: 16px; height: 16px; color: var(--muted); }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { transform: translateY(54px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- animated rings, ripple, bubbles ---------- */
  .av { position: relative; flex: none; display: grid; place-items: center; }
  .ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #5b8dff, #d6e4ff, #2a55e0, #7aa6ff, #5b8dff);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    animation: spin 4s linear infinite;
  }
  .profile { overflow: hidden; }
  .profile .av .avatar { position: relative; }

  .ripple {
    position: absolute;
    z-index: 4;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.28);
    transform: scale(0);
    pointer-events: none;
    animation: ripple .65s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }

  .bub {
    position: absolute;
    bottom: -12px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(214, 230, 255, 0.95), rgba(110, 160, 255, 0.25));
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translate3d(0, 0, 0); }
    12% { opacity: 0.55; }
    85% { opacity: 0.3; }
    100% { opacity: 0; transform: translate3d(26px, -110vh, 0); }
  }

    background: linear-gradient(100deg, #ffffff 0%, #ffffff 38%, #a9c6ff 50%, #ffffff 62%, #ffffff 100%);

    color: transparent;
    animation: shine 7s linear infinite;

  /* ----- Telegram setup ----- */
  var tg = window.Telegram && window.Telegram.WebApp;

  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === "select") tg.HapticFeedback.selectionChanged();
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  }

  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#030813"); } catch (e) {}
    try { tg.setBackgroundColor("#030813"); } catch (e) {}
    try { tg.setBottomBarColor("#030813"); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
  }

  /* ----- profile from Telegram ----- */
  var user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var first = user && user.first_name ? user.first_name : "";
  var full = user ? [user.first_name, user.last_name].filter(Boolean).join(" ") : "";
  var initial = (first || "Г").charAt(0).toUpperCase();

  function fillAvatar(el) {
    el.textContent = "";
    if (user && user.photo_url) {
      var img = document.createElement("img");
      img.alt = "";
      img.src = user.photo_url;
      img.onerror = function () { el.textContent = initial; };
      el.appendChild(img);
    } else {
      el.textContent = initial;
    }
  }
  fillAvatar(document.getElementById("avatarTop"));
  fillAvatar(document.getElementById("avatarBig"));
  document.getElementById("nameTop").textContent = first || "Профиль";
  document.getElementById("nameBig").textContent = full || "Гость";
  document.getElementById("subBig").textContent = user && user.username ? "@" + user.username : (user ? "Без username" : "Откройте в Telegram");
  (function () {
    var chips = [];
    if (user && user.id) chips.push('<span class="me-chip">ID ' + esc(user.id) + "</span>");
    if (user && user.is_premium) chips.push('<span class="me-chip prem">★ Premium</span>');
    document.getElementById("meChips").innerHTML = chips.join("");
  })();

  /* ----- category cards ----- */
  var grid = document.getElementById("grid");
  grid.innerHTML = CATEGORIES.map(function (c, i) {
    return '<button class="card' + (c.wide ? " wide" : "") + '" type="button" data-id="' + c.id + '" style="--i:' + i + ";--acc:" + c.acc + '">' +
      '<span class="art-wrap">' + ART[c.art] + "</span>" +
      '<span class="txt"><h2>' + esc(c.title) + '</h2><span class="cnt">' + esc(count(c)) + "</span></span>" +
      '<span class="go">' + ARROW + "</span></button>";
  }).join("");

  /* ----- counters count up on load ----- */
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    CATEGORIES.forEach(function (c, i) {
      if (!c.users.length) return;
      var el = grid.querySelector('[data-id="' + c.id + '"] .cnt');
      if (!el) return;
      var total = c.users.length, t0 = null, delay = 450 + i * 90;
      el.textContent = plural(0, c.forms);
      function step(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min(1, Math.max(0, (ts - t0 - delay) / 900));
        var k = 1 - Math.pow(1 - p, 3);
        el.textContent = plural(Math.round(total * k), c.forms);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* ----- sheets ----- */
  var current = null;

  function closeSheet() {
    if (!current) return;
    current.classList.remove("open");
    current = null;
    if (tg && tg.BackButton) { try { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); } catch (e) {} }
  }
  function openSheet(el) {
    if (current) closeSheet();
    current = el;
    el.classList.add("open");
    if (tg && tg.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); } catch (e) {} }
  }

  /* элемент списка: строка "chat_nft1" (покажется как @chat_nft1) или объект { title, url } со скрытой ссылкой */
  function itemOf(c, u) {
    if (typeof u === "string") return { title: "@" + u, url: "https://t.me/" + u };
    return { title: u.title, url: u.url };
  }

  var currentCat = null;

  function openLink(url) {
    url = String(url).replace(/^https?:\/\/telegram\.me\//, "https://t.me/");
    haptic("select");
    if (tg && tg.openTelegramLink) { try { tg.openTelegramLink(url); return; } catch (e) {} }
    window.open(url, "_blank", "noopener");
  }

  var sheetCat = document.getElementById("sheetCat");
  var sheetProfile = document.getElementById("sheetProfile");
  var panelCat = document.getElementById("panelCat");
  var catList = document.getElementById("catList");

  grid.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    var c = CATEGORIES.filter(function (x) { return x.id === card.getAttribute("data-id"); })[0];
    if (!c) return;
    currentCat = c;
    haptic();

    panelCat.style.setProperty("--acc", c.acc);
    panelCat.style.setProperty("--g1", c.g1);
    panelCat.style.setProperty("--g2", c.g2);
    document.getElementById("catArt").innerHTML = ART[c.art];
    document.getElementById("catTitle").textContent = c.title;
    document.getElementById("catCount").textContent = count(c);

    if (c.users.length) {
      catList.innerHTML = c.users.map(function (u, i) {
        var it = itemOf(c, u);
        return '<div class="row" style="--i:' + i + '">' +
          '<span class="tile">' + icon(c.icon) + "</span>" +
          '<span class="tx"><b>' + esc(it.title) + "</b><small>" + esc(c.sub) + "</small></span>" +
          '<button class="go-btn" type="button" style="--i:' + i + '" data-i="' + i + '">Перейти' + OUT + "</button></div>";
      }).join("");
    } else {
      catList.innerHTML = '<div class="empty"><span class="ei">' + icon(c.icon) + "</span><b>Пока пусто</b><span>Здесь скоро появятся ссылки</span></div>";
    }
    catList.scrollTop = 0;
    openSheet(sheetCat);
  });

  catList.addEventListener("click", function (e) {
    var b = e.target.closest(".go-btn");
    if (!b || !currentCat) return;
    var u = currentCat.users[Number(b.getAttribute("data-i"))];
    if (u) openLink(itemOf(currentCat, u).url);
  });

  document.getElementById("pbtn").addEventListener("click", function () { haptic(); openSheet(sheetProfile); });

  [sheetCat, sheetProfile].forEach(function (s) {
    s.addEventListener("click", function (e) {
      if (e.target === s || e.target.closest("[data-close]")) { haptic(); closeSheet(); }
    });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  /* ----- ripple on tap ----- */
  document.addEventListener("pointerdown", function (e) {
    var t = e.target.closest(".card, .go-btn, .profile, .close");
    if (!t) return;
    var r = t.getBoundingClientRect();
    var size = Math.max(r.width, r.height) * 2;
    var d = document.createElement("span");
    d.className = "ripple";
    d.style.width = d.style.height = size + "px";
    d.style.left = (e.clientX - r.left - size / 2) + "px";
    d.style.top = (e.clientY - r.top - size / 2) + "px";
    t.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 750);
  });

  /* ----- rising bubbles in the background ----- */
  (function () {
    var f = document.querySelector(".field");
    var v = f && f.querySelector(".vignette");
    if (!f || !v) return;
    for (var i = 0; i < 12; i++) {
      var b = document.createElement("span");
      var sz = 3 + Math.random() * 6;
      b.className = "bub";
      b.style.cssText = "left:" + (Math.random() * 100).toFixed(1) + "%;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) +
        "px;animation-duration:" + (16 + Math.random() * 16).toFixed(1) + "s;animation-delay:-" + (Math.random() * 30).toFixed(1) + "s";
      f.insertBefore(b, v);
    }
  })();
})();
</script>
</body>
</html>
