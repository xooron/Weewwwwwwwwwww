    .logo {
      display: flex; align-items: center; gap: 12px;

      letter-spacing: .5px;
    }
    .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: #4cc9f0; display:inline-block; }

    .right-area { display: flex; align-items: center; gap: 12px; }

    .balance {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: #fff; font-size: 12px;
      border: 1px solid rgba(255,255,255,.18);
      white-space: nowrap;
      transition: transform .3s;
    }
    .balance:hover { transform: translateY(-1px); }
    .balance .coin {
      width: 16px; height: 16px; border-radius: 50%; display:inline-flex; align-items: center; justify-content: center;
      background: #ffd166; color: #1f1f1f; font-size: 11px; font-weight: 700;
    }

    .avatar {
      width: 42px; height: 42px; border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(255,255,255,.7);
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6a8cff 0%, #b36aff 100%);
    }
    .avatar img { width:100%; height:100%; object-fit: cover; }

    main { min-height: calc(100vh - 120px); padding: 20px; display: grid; place-items: center; }

    /* Контейнер рулетки и панели */
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 40px;
      width: min(1100px, 92%);
      align-items: center;
    }

    /* Рулетка */
    .wheel-stage {
      display: grid; place-items: center;
    }

    .wheel {
      width: 420px; height: 420px; border-radius: 50%;
      background: conic-gradient(#f55 0 36deg, #f8a 36deg 72deg, #5df 72deg 108deg, #6f8 108deg 144deg, #f5c 144deg 180deg,
                                 #9cf 180deg 216deg, #f99 216deg 252deg, #9f9 252deg 288deg, #6ff 288deg 324deg, #ff6 324deg 360deg);
      position: relative;
      box-shadow: inset 0 0 0 8px rgba(0,0,0,.15), 0 12px 30px rgba(0,0,0,.4);
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    }
    /* Центр круга */
    .wheel:after {
      content: "";
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.0) 40%),
                  radial-gradient(circle at 70% 70%, rgba(0,0,0,.25), rgba(0,0,0,0) 40%);
      border: 6px solid rgba(255,255,255,.8);
      box-shadow: inset 0 0 24px rgba(0,0,0,.25);
      z-index: 2;
    }

    /* Метки вокруг круга (названия призов) */
    .pin {
      position: absolute;
      left: 50%; top: 50%;
      width: max-content;
      text-align: center;
      color: #fff;
      font-size: 12px;
      transform-origin: center;
      mix-blend-mode: screen;
      padding: 4px 6px;
      white-space: nowrap;
      pointer-events: none;
    }
    /* Расположение 10 надписей по кругу (центр каждого надписи повернуть обратно к читаемому виду) */
    /* i от 0 до 9 задаёт угол в 36deg */
    /* Прямые стили будут вставлены через inline style="--i:0" и мы используем их в CSS ниже */
    .pin[data-i] {
      transform: rotate(calc(var(--i) * 36deg)) translate(-50%, -210px) rotate(calc(-1 * var(--i) * 36deg));
    }

    .pointer {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 22px solid #fff;
      transform: translate(-50%, -100%);
      z-index: 5;
    }

    .spin-area { margin-top: 14px; display: flex; justify-content: center; }

    .btn {
      padding: 12px 22px; font-size: 16px; font-weight: 700;
      border-radius: 999px; border: none; cursor: pointer;
      color: #0b0b0c; background: #ffd166;
      box-shadow: 0 6px 14px rgba(0,0,0,.25);
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
